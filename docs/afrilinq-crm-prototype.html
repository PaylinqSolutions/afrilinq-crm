<meta charset="utf-8">
<title>Afrilinq CRM Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: the CRM shell (top bar, grouped side nav, work area). Prototype controls (viewing-as, reset) live in the top bar. */
  :root {
    --bg: #f4f6fa; --surface: #ffffff; --raised: #f8f9fc; --ink: #0f1b2d; --ink-2: #3a4960; --muted: #67758b; --line: #dfe5ee;
    --brand: #002366; --brand-text: #002366; --brand-soft: #eef2fa; --on-brand: #ffffff; --accent: #006b6b; --accent-soft: #e6f4f4;
    --red: #b42318; --red-soft: #fdecea; --amber: #93510b; --amber-soft: #fdf2df; --green: #0b6b46; --green-soft: #e3f5ec;
    --blue: #1d4ea8; --blue-soft: #e7eefb; --violet: #5b3aa6; --violet-soft: #f0ebfb; --shadow: rgba(10, 20, 40, .16);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a111e; --surface: #111a2b; --raised: #0e1726; --ink: #e7ecf4; --ink-2: #c3cddb; --muted: #8f9cb1; --line: #22304a;
      --brand: #3559b5; --brand-text: #9fb8ff; --brand-soft: #18264a; --on-brand: #ffffff; --accent: #4fc4c4; --accent-soft: #0f2d33;
      --red: #ff9b8f; --red-soft: #3a1714; --amber: #f5c26b; --amber-soft: #33240b; --green: #6fd8a8; --green-soft: #0c2b1f;
      --blue: #9cbcff; --blue-soft: #15264a; --violet: #c6b2ff; --violet-soft: #251b45; --shadow: rgba(0, 0, 0, .5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a111e; --surface: #111a2b; --raised: #0e1726; --ink: #e7ecf4; --ink-2: #c3cddb; --muted: #8f9cb1; --line: #22304a;
    --brand: #3559b5; --brand-text: #9fb8ff; --brand-soft: #18264a; --on-brand: #ffffff; --accent: #4fc4c4; --accent-soft: #0f2d33;
    --red: #ff9b8f; --red-soft: #3a1714; --amber: #f5c26b; --amber-soft: #33240b; --green: #6fd8a8; --green-soft: #0c2b1f;
    --blue: #9cbcff; --blue-soft: #15264a; --violet: #c6b2ff; --violet-soft: #251b45; --shadow: rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brand-text); outline-offset: 2px; }
  a { color: var(--brand-text); }

  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
    padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--brand-text); white-space: nowrap; }
  .logo-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-size: 13px; }
  .proto-tag { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }
  .search { flex: 1 1 200px; min-width: 0; max-width: 380px; }
  .search input { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); }
  .spacer { flex: 1; }
  .as { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .as select { max-width: 250px; min-width: 0; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-weight: 600; }
  .count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--red); color: var(--surface); font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; }
  .count.soft { background: var(--brand-soft); color: var(--brand-text); }

  .shell { display: grid; grid-template-columns: 206px minmax(0, 1fr); }
  nav.side { border-right: 1px solid var(--line); background: var(--surface); padding: 12px 8px 24px; display: flex; flex-direction: column; gap: 1px;
    position: sticky; top: calc(49px + env(safe-area-inset-top, 0px)); height: calc(100vh - 49px); overflow: auto; }
  nav.side button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 7px; color: var(--ink-2); font-weight: 500; }
  nav.side button:hover { background: var(--raised); }
  nav.side button[aria-current="page"] { background: var(--brand-soft); color: var(--brand-text); font-weight: 650; }
  nav.side button:focus-visible { outline: 2px solid var(--brand-text); }
  nav.side button[disabled] { opacity: .4; cursor: not-allowed; }
  .side-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 12px 10px 3px; }
  main { min-width: 0; padding-block: 18px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .page { max-width: 1140px; margin: 0 auto; display: grid; gap: 16px; }

  .phead { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; justify-content: space-between; }
  .phead > div { min-width: 0; }
  .backrow { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .backbtn { all: unset; cursor: pointer; color: var(--brand-text); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .backbtn:focus-visible { outline: 2px solid var(--brand-text); }
  h1 { font-size: 21px; line-height: 1.25; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
  h2 { font-size: 15px; margin: 0; }
  h3 { font-size: 13.5px; margin: 0; }
  .sub { color: var(--muted); margin: 3px 0 0; font-size: 13px; max-width: 75ch; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .strong { font-weight: 650; color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .between { justify-content: space-between; }
  .grid { display: grid; gap: 16px; }
  .cols-2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 16px; align-items: start; }
  .cols-even { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
  .panel-head { padding: 11px 14px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .panel-body { padding: 14px; display: grid; gap: 12px; }
  .panel-body.tight { gap: 6px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .stat { all: unset; box-sizing: border-box; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
  .stat:hover { border-color: var(--brand-text); }
  .stat:focus-visible { outline: 2px solid var(--brand-text); }
  .stat .l { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; }
  .stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .stat .s { font-size: 12px; color: var(--muted); }
  .stat.warn .v { color: var(--amber); } .stat.bad .v { color: var(--red); }

  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 650; white-space: nowrap; }
  .t-red { background: var(--red-soft); color: var(--red); } .t-amber { background: var(--amber-soft); color: var(--amber); }
  .t-green { background: var(--green-soft); color: var(--green); } .t-blue { background: var(--blue-soft); color: var(--blue); }
  .t-violet { background: var(--violet-soft); color: var(--violet); } .t-gray { background: var(--raised); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
  .t-brand { background: var(--brand-soft); color: var(--brand-text); }
  .sev { font-family: var(--mono); font-size: 11px; }

  .btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 12px; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--raised); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .btn.primary:hover { filter: brightness(1.12); }
  .btn.danger { color: var(--red); border-color: var(--red); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--brand-text); }
  .btn.sm { padding: 3px 9px; font-size: 12px; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .link { all: unset; cursor: pointer; color: var(--brand-text); font-weight: 600; }
  .link:hover { text-decoration: underline; }
  .link:focus-visible { outline: 2px solid var(--brand-text); }

  .tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); }
  .tabs button { all: unset; cursor: pointer; padding: 8px 12px; border-bottom: 2px solid transparent; color: var(--ink-2); font-weight: 550; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .tabs button[aria-selected="true"] { color: var(--brand-text); border-bottom-color: var(--brand-text); font-weight: 650; }
  .tabs button:focus-visible { outline: 2px solid var(--brand-text); }
  .tw { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650; white-space: nowrap; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover { background: var(--raised); }
  tr.bad td { background: var(--red-soft); }
  td.num, .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td select, td input { padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 12.5px; max-width: 160px; }
  .empty { padding: 24px 14px; text-align: center; color: var(--muted); }
  code { font-family: var(--mono); font-size: 12px; background: var(--brand-soft); color: var(--brand-text); padding: 1px 5px; border-radius: 4px; }

  form.f { display: grid; gap: 10px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .field { display: grid; gap: 3px; min-width: 0; }
  .field > label { font-size: 12px; font-weight: 650; color: var(--ink-2); }
  .field .req { color: var(--red); }
  .field input:not([type=checkbox]):not([type=radio]), .field select, .field textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .field textarea { resize: vertical; min-height: 56px; }
  .hint { font-size: 12px; color: var(--muted); }
  .err { font-size: 12px; color: var(--red); font-weight: 600; }
  .field.bad input, .field.bad select, .field.bad textarea { border-color: var(--red); }
  .formerr { color: var(--red); font-weight: 600; font-size: 13px; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
  .check input { margin-top: 3px; }
  .note { font-size: 12.5px; background: var(--raised); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; color: var(--ink-2); }
  .note.warn { background: var(--amber-soft); border: 0; color: var(--ink); }
  .note.good { background: var(--green-soft); border: 0; color: var(--ink); }
  .note.bad { background: var(--red-soft); border: 0; color: var(--ink); }
  dl.kv { display: grid; grid-template-columns: minmax(110px, max-content) minmax(0, 1fr); gap: 5px 14px; margin: 0; font-size: 13px; }
  dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  ul.plain { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
  ul.plain li { min-width: 0; }

  .journey { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 6px; }
  .jstep { border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; font-size: 12px; background: var(--surface); min-width: 0; }
  .jstep b { display: flex; gap: 5px; align-items: center; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .jstep .d { display: block; margin-top: 2px; color: var(--ink-2); }
  .jdot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
  .jstep.done .jdot { background: var(--green); } .jstep.current { border-color: var(--brand-text); background: var(--brand-soft); } .jstep.current .jdot { background: var(--brand-text); }
  .jstep.attn { border-color: var(--amber); background: var(--amber-soft); } .jstep.attn .jdot { background: var(--amber); }

  .timeline { display: grid; gap: 10px; }
  .tl { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
  .tl .ic { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-text); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
  .tl .meta { font-size: 12px; color: var(--muted); }
  .tl .body { white-space: pre-wrap; color: var(--ink-2); font-size: 13px; }

  .kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 8px; }
  .kcol { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: grid; gap: 8px; align-content: start; min-height: 120px; }
  .kcol.over { border-color: var(--brand-text); background: var(--brand-soft); }
  .khead { display: flex; justify-content: space-between; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink-2); padding: 2px 4px; }
  .khead span { font-weight: 600; color: var(--muted); }
  .kcard { all: unset; box-sizing: border-box; cursor: grab; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; display: grid; gap: 3px; font-size: 12.5px; }
  .kcard:hover { border-color: var(--brand-text); }
  .kcard:focus-visible { outline: 2px solid var(--brand-text); }
  .kcard .t { font-weight: 650; color: var(--ink); }
  .kcard.dragging { opacity: .5; }

  .bars { display: grid; gap: 7px; }
  .bar { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: minmax(90px, 160px) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 12.5px; }
  .bar:focus-visible { outline: 2px solid var(--brand-text); }
  .bar .track { height: 12px; background: var(--raised); border-radius: 0 4px 4px 0; border: 1px solid var(--line); border-left: 0; }
  .bar .fill { height: 100%; background: var(--brand); border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar:hover .fill { filter: brightness(1.15); }
  .meter { height: 8px; background: var(--raised); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
  .meter > i { display: block; height: 100%; }

  .esc { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .esc.attn { border-color: var(--amber); }
  .esc-top { padding: 12px 14px; display: grid; gap: 7px; }
  .steps { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 12px; list-style: none; padding: 0; margin: 0; }
  .steps li { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
  .steps .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .steps li.done { color: var(--ink); } .steps li.done .dot { background: var(--green); }
  .steps li.now { color: var(--ink); font-weight: 650; } .steps li.now .dot { background: var(--brand-text); box-shadow: 0 0 0 3px var(--brand-soft); }
  .steps li.badst { color: var(--red); } .steps li.badst .dot { background: var(--red); }
  .steps .sep { color: var(--line); }
  .updates { border-top: 1px solid var(--line); background: var(--raised); padding: 10px 14px; display: grid; gap: 8px; font-size: 13px; }
  .actions { border-top: 1px solid var(--line); padding: 10px 14px; display: grid; gap: 10px; }
  .msg { padding: 10px 12px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line); white-space: pre-wrap; }
  .msg.agent { background: var(--brand-soft); border-color: transparent; }
  .msg.internal { background: var(--amber-soft); border-color: transparent; }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; white-space: normal; }

  .doc-paper { background: #ffffff; color: #0f1b2d; border-radius: 6px; box-shadow: 0 2px 16px var(--shadow); padding: 36px 40px; max-width: 820px; margin: 0 auto; width: 100%; }
  .doc-paper table th { color: #ffffff; background: #002366; }
  .doc-paper table td { border-color: #dfe5ee; color: #0f1b2d; }
  .doc-paper .dhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; border-bottom: 2px solid #002366; padding-bottom: 14px; margin-bottom: 16px; }
  .doc-paper h2 { font-size: 22px; color: #002366; }
  .doc-paper .dm { color: #5b6b82; font-size: 12px; }
  .doc-paper .stamp { display: inline-block; border: 2px solid currentColor; border-radius: 6px; padding: 2px 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; transform: rotate(-4deg); }
  .doc-paper .clause h4 { margin: 14px 0 3px; font-size: 13.5px; }
  .doc-paper .clause p { margin: 0; font-size: 13px; line-height: 1.55; white-space: pre-wrap; }
  .totals { margin-left: auto; width: min(320px, 100%); display: grid; gap: 3px; font-size: 13px; margin-top: 10px; }
  .totals div { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
  .totals .grand { border-top: 2px solid #002366; padding-top: 5px; font-weight: 800; font-size: 15px; }

  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8, 14, 28, .45); display: grid; place-items: start center; overflow: auto;
    padding-block: max(40px, env(safe-area-inset-top, 0px)) 40px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .modal { background: var(--surface); border-radius: 14px; width: min(640px, 100%); box-shadow: 0 20px 50px var(--shadow); display: grid; }
  .modal.wide { width: min(860px, 100%); }
  .modal-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .modal-body { padding: 16px; display: grid; gap: 12px; }
  .x { all: unset; cursor: pointer; font-size: 20px; line-height: 1; color: var(--muted); padding: 2px 6px; border-radius: 6px; }
  .x:hover { background: var(--raised); }
  .x:focus-visible { outline: 2px solid var(--brand-text); }
  .drawer { position: fixed; top: calc(52px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: min(380px, calc(100vw - 24px)); max-height: 72vh; overflow: auto; z-index: 40;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px var(--shadow); }
  .drawer .item { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 2px; width: 100%; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .drawer .item:hover { background: var(--raised); }
  .drawer .item.unread { box-shadow: inset 3px 0 0 var(--brand-text); }
  .toast { position: fixed; bottom: max(16px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-weight: 600; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px var(--shadow); display: flex; gap: 12px; align-items: center; }
  .toast button { all: unset; cursor: pointer; text-decoration: underline; font-weight: 700; }
  .tour { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .tour b { color: var(--ink); }

  @media (max-width: 900px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    nav.side { position: static; height: auto; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-block: 6px;
      padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
    nav.side button { white-space: nowrap; }
    .side-label { display: none; }
    .cols-2 { grid-template-columns: minmax(0, 1fr); }
    .doc-paper { padding: 22px 18px; }
  }

function search(q) {
  q = q.trim().toLowerCase(); if (q.length < 2) return;
  const hit = (s) => String(s || "").toLowerCase().includes(q);
  const groups = [
    ["Companies", "company", S.companies.filter((c) => !c.deleted && visibleCompany(c) && hit(c.name)).map((c) => [c.id, c.name, c.city])],
    ["Contacts", "contact", S.contacts.filter((k) => !k.deleted && visibleContact(k) && (hit(cname(k)) || hit(k.email))).map((k) => [k.id, cname(k), k.email])],
    ["Deals", "deal", S.deals.filter((d) => visibleDeal(d) && hit(d.name)).map((d) => [d.id, d.name, stage(d.stage).name])],
    ["Leads", "lead", S.leads.filter((l) => visibleLead(l) && (hit(l.name) || hit(l.org))).map((l) => [l.id, l.name, l.org])],
    ["Tickets", "ticket", S.tickets.filter((t) => visibleTicket(t) && (hit(t.number) || hit(t.subject))).map((t) => [t.id, `${t.number} ${t.subject}`, company(t.companyId)?.name])],
    ["Documents", "doc", S.docs.filter((d) => hit(d.number) || hit(d.title)).map((d) => [d.id, d.number, d.title])],
  ].filter((g) => g[2].length && navAllowed(navKeyOf(g[1])));
  modal(`Search: ${q}`, groups.length ? groups.map(([t, page, rows]) => `<div><h3 class="small muted" style="text-transform:uppercase">${t}</h3><ul class="plain" style="margin-top:4px">${rows.slice(0, 8).map(([id, l, s]) => `<li><button class="link" data-go="${page}" data-id="${id}">${esc(l)}</button>${s ? ` <span class="small muted">${esc(s)}</span>` : ""}</li>`).join("")}</ul></div>`).join("") : `<div class="empty">Nothing you can access matches “${esc(q)}”.</div>`);
}

function visibleTicket(t) {
  if (can("tickets.view_all")) return true;

  return false;
}

const DISC_LIMIT = () => S.settings.discountThreshold;
function missingFor(d, stKey) {
  const st = stage(stKey), miss = [];
  for (const r of st.req) { if (r === "lines" ? !d.lines.length : r === "amount" ? !(d.amount > 0) : !d[r]) miss.push(r); }
  if (stKey === "won") { for (const r of ["amount", "primaryContactId", "lines", "agreementRef", "billingFrequency", "startDate"]) if (r === "lines" ? !d.lines.length : r === "amount" ? !(d.amount > 0) : !d[r]) miss.push(r); if (d.discount > DISC_LIMIT() && d.discountStatus !== "approved") miss.push("discount"); }
  return [...new Set(miss)];
}
function moveDeal(id, to, lossReason) {
  const d = deal(id), from = d.stage; if (from === to) return null;
  if (!can("deals.edit") || !visibleDeal(d)) throw new Invalid("You can't move this deal.");
  if (from === "won") throw new Invalid("Commercial fields lock after Closed Won. Use a handover correction instead.");
  const miss = missingFor(d, to);
  if (miss.length) { showGate(d, to, miss); return "gate"; }
  if (to === "lost" && !lossReason) { modal("Why was this deal lost?", `<form class="f" data-form="lost" data-id="${d.id}">${fld("Loss reason", sel("reason", ["Price", "Chose a competitor", "Budget moved to next year", "No decision", "Missing feature", "Other"].map((x) => [x, x]), "", "Choose…"), { name: "reason", req: true })}<div class="row"><span class="spacer"></span><button class="btn primary">Mark Closed Lost</button></div></form>`); return "gate"; }
  d.history.push({ from, to, at: Date.now(), by: me(), days: Math.round((Date.now() - d.stageAt) / DAY) }); d.stage = to; d.stageAt = Date.now(); if (lossReason) d.lossReason = lossReason;
  audit("deal.stage_changed", d.name, `${stage(from).name} → ${stage(to).name}`);
  if (to === "won") {
    d.closeDate = Date.now(); company(d.companyId).lifecycle = "customer";
    let h = S.handovers.find((x) => x.dealId === d.id);
    if (!h) { const pc = contact(d.primaryContactId); h = { id: uid("h"), dealId: d.id, status: "draft", values: { customerName: company(d.companyId).name, primaryContact: pc ? `${cname(pc)}, ${pc.title || ""}, ${pc.email || pc.phone || ""}` : "", productsSold: d.lines.map((l) => `${product(l.productId).name} × ${l.qty}`).join(", "), agreementReference: d.agreementRef, pricing: `${naira(d.amount)} · ${d.billingFrequency}`, startDate: isoDay(d.startDate), discount: d.discount ? `${d.discount}% (approved)` : "None", salesExecutive: U(d.owner).name }, createdAt: Date.now(), reviewComments: [] }; S.handovers.unshift(h); }
    notify([d.owner, ...usersByRole("sales_manager"), ...usersWith("handover.review")], `Closed Won: ${d.name}. Handover created.`, "handover", h.id);
    return { msg: "Closed Won. A handover was created for Onboarding.", action: { page: "handover", id: h.id, label: "Open handover" } };
  }
  return { msg: `Moved to ${stage(to).name}.` };
}
function showGate(d, to, miss) {
  modal(to === "won" ? "Not ready for Closed Won" : `Can't move to ${stage(to).name} yet`, `<p style="margin:0">${to === "won" ? "Moving a deal to Closed Won requires:" : "This stage requires:"}</p><ul class="plain">${miss.map((m) => `<li class="row"><span class="pill t-red">Missing</span> ${esc(REQ_LABEL[m] || m)}</li>`).join("")}</ul><div class="row"><span class="spacer"></span><button class="btn primary" data-go="deal" data-id="${d.id}" data-tab="details">Fix in deal</button></div>`);
}

FORMS["add-line"] = (v, f) => { if (!v.productId) throw new Invalid("Choose a product.", { productId: "Required." }); const d = deal(f.dataset.id), p = product(v.productId); d.lines.push({ productId: p.id, qty: Math.max(1, Number(v.qty) || 1), price: p.price, disc: Number(d.discount) || 0 }); recalc(d); audit("deal.products_changed", d.name, `+ ${p.name}`); return "Product added."; };
FORMS["deal-edit"] = (v, f) => {
  const d = deal(f.dataset.id);
  if (!v.nextStep.trim()) throw new Invalid("Every open deal needs a next step.", { nextStep: "Required." });

  let msg = "Deal saved.";
  if (disc !== d.discount) { d.discount = disc; d.lines.forEach((l) => (l.disc = disc)); recalc(d); if (disc > DISC_LIMIT()) { d.discountStatus = "pending"; notify(usersWith("deals.approve_discount").filter((u) => U(u).role === "sales_manager"), `Discount approval needed: ${d.name} — ${disc}%`, "deal", d.id); msg = `Saved. The ${disc}% discount needs Sales Manager approval.`; } else d.discountStatus = "none"; audit("deal.discount_changed", d.name, `${disc}%`); }

/* ===== Handovers ===== */
const HO_STATUS = { draft: ["Draft · Pending Sales Submission", "amber"], submitted: ["Submitted · Awaiting review", "blue"], changes_requested: ["Changes requested", "red"], accepted: ["Accepted", "green"] };

  ${journey(d.companyId)}
  ${h.status === "accepted" ? `<div class="note good">Accepted by ${esc(U(h.acceptedBy).name)} ${fmtDate(h.acceptedAt)}${h.overrideReason ? ` with an override: “${esc(h.overrideReason)}”` : ""}. Sales can no longer edit; corrections go through request and approve.${proj ? ` Onboarding project: ${ulink("project", proj.id, proj.name)}.` : ""}</div>` : ""}
  ${h.status === "changes_requested" ? `<div class="note bad"><b>Onboarding requested changes:</b> ${esc(h.reviewComments.at(-1)?.text || "")}</div>` : ""}
  <div class="cols-2"><div class="grid">
    <section class="panel"><div class="panel-head"><h2>Handover checklist</h2>${miss.length ? pill(`${miss.length} required missing`, "amber") : pill("Complete", "green")}</div><div class="panel-body">
    <form class="f" data-form="handover" data-id="${h.id}">${sections.map((s) => `<h3 style="margin-top:6px">${s}</h3><div class="grid2">${HANDOVER_FIELDS.filter((x) => x[0] === s).map(([, k, l, req, long]) => fld(l, editable ? (long ? ta(k, h.values[k], 2) : inp(k, h.values[k])) : `<div class="small" style="white-space:pre-wrap;padding:6px 0;${!h.values[k] && req ? "color:var(--red);font-weight:650" : ""}">${esc(h.values[k] || (req ? "Missing" : "—"))}</div>`, { name: k, req: !!req, span: long })).join("")}</div>`).join("")}
    ${editable ? `<div class="row"><button class="btn" name="do" value="save">Save draft</button><span class="spacer"></span><button class="btn primary" name="do" value="submit">Submit to Onboarding</button></div>` : ""}</form></div></section>
  </div><div class="grid">
    ${reviewer || override ? `<section class="panel"><div class="panel-head"><h2>Review</h2></div><div class="panel-body"><form class="f" data-form="ho-review" data-id="${h.id}">
      ${fld("Comment", ta("comment", "", 3), { name: "comment", req: true, hint: "Required whether you accept or request changes." })}
      ${override ? `${fld("Override reason", ta("reason", "", 2), { name: "reason", hint: `Needed to accept with ${miss.length} required item(s) missing or before submission. Audit-logged with the missing fields.` })}` : ""}
      <div class="row">${reviewer ? `<button class="btn danger" name="do" value="changes">Request changes</button>` : ""}<span class="spacer"></span><button class="btn primary" name="do" value="${miss.length || h.status !== "submitted" ? "override" : "accept"}">${miss.length || h.status !== "submitted" ? "Accept with override" : "Accept handover"}</button></div></form></div></section>` : ""}
    <section class="panel"><div class="panel-head"><h2>Review history</h2></div><div class="panel-body">${h.reviewComments.length ? `<ul class="plain">${h.reviewComments.map((c) => `<li class="small"><b>${esc(U(c.by).name)}</b> · ${fmtDT(c.at)}<div>${esc(c.text)}</div></li>`).join("")}</ul>` : `<div class="small muted">No review yet.</div>`}</div></section>
    ${related([{ title: "Deal", items: [["deal", d.id, d.name, naira(d.amount)]] }, { title: "Onboarding", items: proj ? [["project", proj.id, proj.name, proj.draft ? "Draft" : lbl(ONB_STAGES, proj.stage)]] : [] }])}
  </div></div>`;
};
FORMS.handover = (v, f) => {
  const h = find("handovers", f.dataset.id), d = deal(h.dealId);
  HANDOVER_FIELDS.forEach(([, k]) => { if (k in v) h.values[k] = v[k]; });
  if (v.do === "save") return "Draft saved.";
  const miss = hoMissing(h);
  if (miss.length) throw new Invalid(`${miss.length} required item(s) are missing.`, Object.fromEntries(miss.map(([k]) => [k, "Required before submitting."])));
  h.status = "submitted"; h.submittedAt = Date.now();
  if (!S.projects.some((p) => p.handoverId === h.id)) S.projects.unshift({ id: uid("pr"), name: d.name, companyId: d.companyId, handoverId: h.id, owner: usersByRole("onboarding_manager")[0], stage: "handover_review", goLive: fromIso(h.values.targetGoLive), productId: d.lines[0]?.productId, createdAt: Date.now(), draft: true, tasks: [], blockers: [], completion: null });
  notify(usersWith("handover.review"), `Handover submitted for review: ${d.name}`, "handover", h.id); audit("handover.submitted", d.name, "17 of 17 required items complete");
  return "Submitted. A draft onboarding project was created and Onboarding was notified.";
};
FORMS["ho-review"] = (v, f) => {
  const h = find("handovers", f.dataset.id), d = deal(h.dealId), miss = hoMissing(h);
  if (!v.comment.trim()) throw new Invalid("Add a comment.", { comment: "Required either way." });
  h.reviewComments.push({ by: me(), at: Date.now(), text: v.comment.trim() });
  if (v.do === "changes") { h.status = "changes_requested"; notify([d.owner], `Changes requested on handover: ${d.name}`, "handover", h.id); audit("handover.changes_requested", d.name, v.comment); return "Changes requested. Sales was notified."; }
  if (v.do === "override") { if (!can("handover.override")) throw new Invalid("You need the override permission."); if (!v.reason?.trim()) throw new Invalid("Give an override reason.", { reason: "Required." }); h.overrideReason = v.reason.trim(); audit("handover.override", d.name, `Missing: ${miss.map((m) => m[1]).join("; ") || "not submitted"} · Reason: ${v.reason}`); }
  h.status = "accepted"; h.acceptedAt = Date.now(); h.acceptedBy = me();
  let p = S.projects.find((x) => x.handoverId === h.id);
  if (!p) { p = { id: uid("pr"), name: d.name, companyId: d.companyId, handoverId: h.id, owner: me(), createdAt: Date.now(), blockers: [], completion: null }; S.projects.unshift(p); }
  const pid = d.lines[0]?.productId, start = Date.now(), gl = fromIso(h.values.targetGoLive) || start + 45 * DAY, span = Math.max(7 * DAY, gl - start);
  const tpl = [["Kickoff meeting", 0.05, true], ["Collect customer data and requirements", 0.2], ["Configure and set up", 0.4], ["Data migration / import", 0.55], ["Internal quality check", 0.65], ["Customer validation (UAT)", 0.75, true], ["Training", 0.85], ["Go-live readiness review", 0.95], ["Go-live", 1, true]];
  Object.assign(p, { draft: false, stage: "kickoff_pending", owner: p.owner || me(), goLive: gl, productId: pid, tasks: tpl.map(([t, at, ms], i) => ({ id: uid("ot"), title: t, status: "todo", due: start + span * at, milestone: !!ms, deps: i ? [] : [] })) });
  p.tasks.forEach((t, i) => { if (i) t.deps = [p.tasks[i - 1].id]; });
  notify([d.owner, ...usersByRole("sales_manager")], `Handover accepted: ${d.name}. Onboarding started.`, "project", p.id); audit("handover.accepted", d.name, v.comment);
  return { msg: "Accepted. The onboarding project was created from the template.", action: { page: "project", id: p.id, label: "Open project" } };
};

/* ===== Onboarding ===== */
function risk(p) {
  const reasons = [], now = Date.now();
  if (p.stage === "completed") return { level: "low", reasons };
  p.tasks.filter((t) => t.milestone && t.status !== "done" && t.due < now - 7 * DAY).forEach((t) => reasons.push([`Milestone “${t.title}” overdue by ${Math.round((now - t.due) / DAY)} days`, "high"]));
  p.tasks.filter((t) => t.milestone && t.status !== "done" && t.due < now && t.due >= now - 7 * DAY).forEach((t) => reasons.push([`Milestone “${t.title}” overdue`, "medium"]));
  p.blockers.filter((b) => b.open && ["high", "critical"].includes(b.severity)).forEach((b) => reasons.push([`Open ${b.severity} blocker: ${b.title}`, "high"]));
  if (p.goLive && p.goLive < now) reasons.push(["Target go-live date has passed", "high"]);
  const gaps = trainingGaps(p); if (gaps.length && p.goLive && p.goLive - now < 14 * DAY) reasons.push([`Required training not complete within 14 days of go-live: ${gaps.join(", ")}`, "medium"]);
  if (p.stage === "on_hold") reasons.push([`On hold: ${p.holdReason}`, "medium"]);
  return { level: reasons.some((r) => r[1] === "high") ? "high" : reasons.length ? "medium" : "low", reasons };
}
function trainingGaps(p) { return S.programs.filter((x) => x.required && x.productId === p.productId).filter((x) => !S.sessions.some((s) => s.programId === x.id && s.projectId === p.id && s.participants.some((pp) => pp.result === "passed"))).map((x) => x.name); }
const riskPill = (p) => { const r = risk(p); return pill(r.level === "high" ? "High risk" : r.level === "medium" ? "Medium risk" : "On track", r.level === "high" ? "red" : r.level === "medium" ? "amber" : "green"); };
PAGES.onboarding = () => {
  const coming = S.handovers.filter((h) => h.status !== "accepted"), active = S.projects.filter((p) => !p.draft);
  const groups = [["Handover & kickoff", ["handover_review", "kickoff_pending", "kickoff_completed"]], ["Build", ["data_collection", "configuration", "data_migration", "quality_check", "uat"]], ["Train & launch", ["training_scheduled", "training_in_progress", "go_live_review", "go_live", "post_go_live"]], ["On hold", ["on_hold"]], ["Completed", ["completed"]]];
  return `${header("Onboarding", "One project per accepted handover, built from the product's template.")}
  <section class="panel"><div class="panel-head"><h2>Coming from Sales (${coming.length})</h2><span class="small muted">Won deals whose handover isn't accepted yet</span></div><div class="panel-body">${coming.length ? `<ul class="plain">${coming.map((h) => `<li class="row between"><span>${ulink("handover", h.id, deal(h.dealId).name)} ${pill(...HO_STATUS[h.status])}</span>${can("handover.review") && h.status === "submitted" ? `<button class="btn sm primary" data-go="handover" data-id="${h.id}">Open handover</button>` : ""}</li>`).join("")}</ul>` : `<div class="small muted">Nothing waiting.</div>`}</div></section>
  <div class="kanban">${groups.map(([g, ks]) => { const ps = active.filter((p) => ks.includes(p.stage)); return `<div class="kcol"><div class="khead">${g}<span>${ps.length}</span></div>${ps.map((p) => `<button class="kcard" data-go="project" data-id="${p.id}"><span class="t">${esc(p.name)}</span><span class="muted">${esc(lbl(ONB_STAGES, p.stage))}</span><span class="muted">Go-live ${fmtDate(p.goLive)}</span>${riskPill(p)}</button>`).join("")}</div>`; }).join("")}</div>`;
};
PAGES.project = (r) => {
  const p = find("projects", r.id), rk = risk(p), mg = can("onboarding.manage") && p.stage !== "completed" && !p.draft;
  const done = p.tasks.filter((t) => t.status === "done").length, gaps = trainingGaps(p), h = find("handovers", p.handoverId);
  return `${header(esc(p.name), `${ulink("company", p.companyId, company(p.companyId).name)} · owner ${esc(U(p.owner).name)} · go-live ${fmtDate(p.goLive)}`, `${riskPill(p)} ${mg ? `<select data-change="proj-stage" data-id="${p.id}" aria-label="Stage">${opts(ONB_STAGES.filter((s) => s[0] !== "completed"), p.stage)}</select>` : pill(lbl(ONB_STAGES, p.stage), p.stage === "completed" ? "green" : "blue")}`, `<button class="link" data-go="onboarding">Onboarding</button>`)}
  ${journey(p.companyId)}
  ${p.draft ? `<div class="note warn">Draft project. It starts when Onboarding accepts the ${ulink("handover", p.handoverId, "handover")}.</div>` : ""}
  ${p.completion ? `<div class="note good">Completed ${fmtDate(p.completion.at)} by ${esc(U(p.completion.by).name)}. ${esc(p.completion.notes)}${p.completion.exception ? ` Exception: ${esc(p.completion.exception)}` : ""}</div>` : ""}
  <div class="cols-2"><div class="grid">
    <section class="panel"><div class="panel-head"><h2>Risk</h2>${riskPill(p)}</div><div class="panel-body">${rk.reasons.length ? `<ul class="plain">${rk.reasons.map(([t, l]) => `<li class="row">${pill(l, l === "high" ? "red" : "amber")} ${esc(t)}</li>`).join("")}</ul>` : `<div class="small muted">No risk signals.</div>`}</div></section>
    <section class="panel"><div class="panel-head"><h2>Tasks and milestones (${done}/${p.tasks.length})</h2><div class="meter" style="width:140px"><i style="width:${p.tasks.length ? (done / p.tasks.length) * 100 : 0}%;background:var(--green)"></i></div></div>
    <div class="tw"><table><thead><tr><th>Task</th><th>Depends on</th><th>Due</th><th>Status</th></tr></thead><tbody>${p.tasks.map((t) => `<tr class="${t.status !== "done" && t.due < Date.now() ? "bad" : ""}"><td>${t.milestone ? pill("Milestone", "violet") + " " : ""}${esc(t.title)}</td><td class="small">${t.deps.map((x) => esc(p.tasks.find((y) => y.id === x)?.title || "")).join(", ") || "—"}</td><td class="num">${fmtDate(t.due)}</td><td>${mg ? `<select data-change="ptask" data-id="${p.id}" data-t="${t.id}" aria-label="Status">${opts([["todo", "To do"], ["in_progress", "In progress"], ["done", "Done"]], t.status)}</select>` : esc(t.status)}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">Tasks are created from the template on acceptance.</td></tr>`}</tbody></table></div></section>
    <section class="panel"><div class="panel-head"><h2>Blockers (${p.blockers.filter((b) => b.open).length} open)</h2></div><div class="panel-body">${p.blockers.length ? `<ul class="plain">${p.blockers.map((b) => `<li class="row between"><span>${pill(b.severity, { critical: "red", high: "red", medium: "amber", low: "gray" }[b.severity])} ${esc(b.title)} <span class="small muted">· ${rel(b.at)}</span></span>${b.open && mg ? `<button class="btn sm" data-act="resolve-blocker" data-id="${p.id}" data-b="${b.id}">Resolve</button>` : b.open ? "" : pill("Resolved", "green")}</li>`).join("")}</ul>` : `<div class="small muted">No blockers.</div>`}
      ${mg ? `<form class="f" data-form="blocker" data-id="${p.id}"><div class="grid2">${fld("New blocker", inp("title"), { name: "title" })}${fld("Severity", sel("severity", [["low", "Low"], ["medium", "Medium"], ["high", "High"], ["critical", "Critical"]], "medium"))}</div><div><button class="btn sm">Add blocker</button></div></form>` : ""}</div></section>
  </div><div class="grid">
    <section class="panel"><div class="panel-head"><h2>Go-live readiness</h2></div><div class="panel-body"><ul class="plain">
      <li class="row">${p.tasks.length && done === p.tasks.length ? pill("Done", "green") : pill("Open", "amber")} All tasks complete</li>
      <li class="row">${p.blockers.some((b) => b.open) ? pill("Open", "amber") : pill("Done", "green")} No open blockers</li>
      <li class="row">${gaps.length ? pill("Gap", "amber") : pill("Done", "green")} Required training passed${gaps.length ? `<div class="small muted">${esc(gaps.join(", "))}</div>` : ""}</li></ul>
      ${can("onboarding.complete") && p.stage !== "completed" && !p.draft ? `<button class="btn primary" data-act="complete-proj" data-id="${p.id}">Confirm go-live and complete</button>` : ""}
      ${can("training.manage") && !p.draft ? `<button class="btn" data-act="new-session" data-company="${p.companyId}" data-project="${p.id}">Schedule training</button>` : ""}</div></section>
    ${related([{ title: "Handover", items: h ? [["handover", h.id, deal(h.dealId).name, HO_STATUS[h.status][0]]] : [] }, { title: "Training", items: S.sessions.filter((s) => s.projectId === p.id).map((s) => ["session", s.id, find("programs", s.programId).name, fmtDT(s.at)]) }, { title: "Tickets", items: S.tickets.filter((t) => t.companyId === p.companyId && OPEN_T.includes(t.status)).map((t) => ["ticket", t.id, `${t.number} ${t.subject}`, t.priority]) }])}
  </div></div>`;
};
CHANGE["proj-stage"] = (el) => { const p = find("projects", el.dataset.id); if (el.value === "on_hold") { modal("Put on hold", `<form class="f" data-form="hold" data-id="${p.id}">${fld("Reason", ta("reason"), { name: "reason", req: true })}<div class="row"><span class="spacer"></span><button class="btn primary">Put on hold</button></div></form>`); render(); $("#modal").hidden = false; return; } p.stage = el.value; audit("onboarding.stage", p.name, lbl(ONB_STAGES, el.value)); return `Stage set to ${lbl(ONB_STAGES, el.value)}.`; };
FORMS.hold = (v, f) => { if (!v.reason.trim()) throw new Invalid("Give a reason.", { reason: "On Hold requires a reason." }); const p = find("projects", f.dataset.id); p.stage = "on_hold"; p.holdReason = v.reason.trim(); audit("onboarding.on_hold", p.name, v.reason); return "Project put on hold."; };
CHANGE.ptask = (el) => {
  const p = find("projects", el.dataset.id), t = p.tasks.find((x) => x.id === el.dataset.t);
  if (el.value !== "todo") { const open = t.deps.map((x) => p.tasks.find((y) => y.id === x)).filter((x) => x && x.status !== "done"); if (open.length) throw new Invalid(`Blocked: finish “${open[0].title}” first.`); }
  t.status = el.value; return el.value === "done" ? `“${t.title}” done.` : "Task updated.";
};
FORMS.blocker = (v, f) => { if (!v.title.trim()) throw new Invalid("Describe the blocker.", { title: "Required." }); const p = find("projects", f.dataset.id); p.blockers.unshift({ id: uid("b"), title: v.title.trim(), severity: v.severity, open: true, at: Date.now() }); if (["high", "critical"].includes(v.severity)) notify([p.owner, ...usersByRole("onboarding_manager")], `${v.severity} blocker on ${p.name}`, "project", p.id); return "Blocker added."; };
ACT["resolve-blocker"] = (b) => { const p = find("projects", b.dataset.id); p.blockers.find((x) => x.id === b.dataset.b).open = false; return "Blocker resolved."; };
ACT["complete-proj"] = (b) => {
  const p = find("projects", b.dataset.id), out = [...p.tasks.filter((t) => t.status !== "done").map((t) => `Task: ${t.title}`), ...p.blockers.filter((x) => x.open).map((x) => `Blocker: ${x.title}`), ...trainingGaps(p).map((g) => `Training: ${g}`)];
  modal("Confirm go-live and complete", `<form class="f" data-form="complete" data-id="${p.id}"><div class="grid2">${fld("Go-live date", inp("golive", isoDay(Date.now()), "date"), { name: "golive", req: true })}</div>${fld("Closure notes", ta("notes"), { name: "notes", req: true })}${out.length ? `<div class="note warn"><b>${out.length} item(s) outstanding:</b><ul style="margin:4px 0 0;padding-left:18px">${out.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>${fld("Exception reason", ta("exception", "", 2), { name: "exception", req: true, hint: "Audit-logged." })}` : ""}<div class="row"><span class="spacer"></span><button class="btn primary">Complete onboarding</button></div></form>`);
};
FORMS.complete = (v, f) => {
  const p = find("projects", f.dataset.id), out = p.tasks.some((t) => t.status !== "done") || p.blockers.some((x) => x.open) || trainingGaps(p).length, e = {};
  if (!v.notes.trim()) e.notes = "Required."; if (out && !v.exception?.trim()) e.exception = "Explain why you're completing with items outstanding.";
  if (Object.keys(e).length) throw new Invalid("Fix the highlighted fields.", e);
  p.stage = "completed"; p.completion = { at: Date.now(), by: me(), notes: v.notes.trim(), exception: v.exception || "", golive: fromIso(v.golive) };
  audit("onboarding.completed", p.name, v.exception ? `Exception: ${v.exception}` : ""); notify([company(p.companyId).owner], `${p.name} is live`, "project", p.id);
  return "Onboarding completed. The customer is live.";
};

/* ===== Training ===== */
const visibleSession = (s) => can("training.view_all") || s.trainer === me();
PAGES.training = (r) => {
  const tab = r.tab || "sessions", list = S.sessions.filter(visibleSession).sort((a, b) => a.at - b.at);
  return `${header("Training", "Programs, sessions, attendance and results.", can("training.manage") ? `<button class="btn primary" data-act="new-session">Schedule session</button>` : "")}

function health(cid) {
  const w = S.settings.healthWeights, now = Date.now(), p = S.projects.filter((x) => x.companyId === cid), tks = S.tickets.filter((t) => t.companyId === cid && OPEN_T.includes(t.status));

  const lastAct = Math.max(0, ...S.activities.filter((a) => a.companyId === cid).map((a) => a.at)), csats = S.tickets.filter((t) => t.companyId === cid && t.csat).map((t) => t.csat);
  const open = p.find((x) => x.stage !== "completed"), rk = open ? risk(open).level : "low";
  const overdue = S.tasks.filter((t) => t.companyId === cid && !t.done && t.due < now).length + S.docs.filter((d) => d.companyId === cid && d.type === "invoice" && d.due < now && !["paid", "void"].includes(d.status)).length;
  const parts = [
    { l: "Onboarding", w: w.onboarding, v: !p.length ? 70 : rk === "high" ? 30 : rk === "medium" ? 60 : 100, why: !p.length ? "No project" : open ? `Project ${rk === "low" ? "on track" : `${rk} risk`}` : "Live" },
    { l: "Support load", w: w.support, v: Math.max(0, 100 - tks.reduce((a, t) => a + ({ P1: 40, P2: 25, P3: 10, P4: 5 }[t.priority]), 0)), why: `${tks.length} open ticket(s)${tks.some((t) => t.priority === "P1") ? ", including P1" : ""}` },
    { l: "Overdue actions", w: w.overdue, v: Math.max(0, 100 - overdue * 25), why: `${overdue} overdue task(s) or invoice(s)` },
    { l: "Training", w: w.training, v: sess.length ? Math.round((sess.filter((x) => x.result === "passed").length / sess.length) * 100) : 60, why: sess.length ? `${sess.filter((x) => x.result === "passed").length} of ${sess.length} passed` : "No results yet" },
    { l: "Engagement", w: w.engagement, v: lastAct > now - 30 * DAY ? 100 : lastAct > now - 60 * DAY ? 60 : 20, why: lastAct ? `Last activity ${rel(lastAct)}` : "No activity" },
    { l: "CSAT", w: w.csat, v: csats.length ? Math.round((csats.reduce((a, b) => a + b, 0) / csats.length) * 20) : 70, why: csats.length ? `Average ${(csats.reduce((a, b) => a + b, 0) / csats.length).toFixed(1)}★` : "No ratings yet" },
  ];
  const score = Math.round(parts.reduce((a, x) => a + x.v * x.w, 0) / parts.reduce((a, x) => a + x.w, 0));

ACT["copy-link"] = (b) => { navigator.clipboard?.writeText(b.dataset.v).then(() => toast("Client link copied."), () => toast("Couldn't copy. Select the link and copy it.")); };
ACT["void-doc"] = (b) => { const d = find("docs", b.dataset.id); d.status = "void"; audit("document.void", d.number); return `${d.number} voided.`; };
ACT["to-invoice"] = (b) => { const q = find("docs", b.dataset.id), d = { ...JSON.parse(JSON.stringify(q)), id: uid("doc"), type: "invoice", number: nextNumber("invoice"), title: `Invoice — ${company(q.companyId).name}`, status: "draft", sourceId: q.id, issue: Date.now(), due: Date.now() + S.settings.terms * DAY, sentAt: null, viewedAt: null, decidedAt: null, signedBy: null, paid: 0, token: Math.random().toString(36).slice(2, 9), createdBy: me() }; S.docs.unshift(d); audit("document.created", d.number, `from ${q.number}`); go("doc", d.id); toast(`${d.number} created from ${q.number}.`); };
FORMS["attach-signed"] = (v, f) => { const e = {}; if (!(v.file && v.file.name)) e.file = "Choose the signed PDF."; if (!v.name.trim()) e.name = "Who signed it?"; if (Object.keys(e).length) throw new Invalid("Fix the highlighted fields.", e); const d = find("docs", f.dataset.id); Object.assign(d, { status: "accepted", signedBy: v.name.trim(), signedTitle: v.title, method: "paper", decidedAt: Date.now(), signedFile: v.file.name }); logActivity({ type: "note", subject: `Signed copy of ${d.number} attached (${v.file.name})`, companyId: d.companyId }); audit("document.signed_copy_attached", d.number, v.file.name); return `Signed copy attached to ${company(d.companyId).name}'s files.`; };
FORMS.payment = (v, f) => { const d = find("docs", f.dataset.id), bal = docTotals(d).total - d.paid, amt = Number(v.amount); if (!(amt > 0)) throw new Invalid("Enter an amount.", { amount: "Required." }); if (amt > bal) throw new Invalid(`That's more than the ${naira(bal)} balance.`, { amount: "Overpayment isn't allowed." }); S.payments.push({ id: uid("pay"), docId: d.id, amount: amt, method: v.method, ref: v.ref, on: fromIso(v.on) || Date.now(), by: me() }); d.paid += amt; d.status = d.paid >= docTotals(d).total ? "paid" : "part_paid"; logActivity({ type: "note", subject: `Payment ${naira(amt)} received on ${d.number}`, companyId: d.companyId }); audit("payment.recorded", d.number, naira(amt)); return d.status === "paid" ? "Payment recorded. Invoice paid in full." : `Part payment recorded. Balance ${naira(docTotals(d).total - d.paid)}.`; };
PAGES.client = (r) => {
  const d = find("docs", r.id);
  if (d.status === "draft") return `<div class="note warn">Drafts aren't visible to clients. Send it first. <button class="link" data-go="doc" data-id="${d.id}">Back</button></div><div style="overflow-x:auto">${paper(d)}</div>`;
  if (d.status === "sent") { d.status = "viewed"; d.viewedAt = Date.now(); notify([d.createdBy], `${d.number} was viewed by the client`, "doc", d.id); save(); }
  const decide = d.type !== "invoice" && ["sent", "viewed"].includes(d.status);
  return `<div class="note">You're previewing the <b>client's private link</b>. <button class="link" data-go="doc" data-id="${d.id}">Back to staff view</button> · In the real CRM “Download PDF” opens the browser's print dialog.</div>
  <div style="overflow-x:auto">${paper(d)}</div>
  ${decide ? `<section class="panel" style="max-width:820px;width:100%;margin:0 auto"><div class="panel-head"><h2>${d.type === "sla" ? "Sign this agreement" : "Accept this quote"}</h2></div><div class="panel-body"><form class="f" data-form="client-decide" data-id="${d.id}"><p class="small muted" style="margin:0">Typing your name is your electronic signature. We record the date, time and IP address with it.</p><div class="grid2">${fld("Full name", inp("name"), { name: "name", req: true })}${fld("Job title", inp("title"))}</div>${chk("agree", `I confirm I'm authorised to ${d.type === "sla" ? "sign this agreement" : "accept this quote"} on behalf of ${esc(company(d.companyId).name)}.`, false)}<div data-name="agree" class="field"></div>
  ${fld("Reason (needed to decline)", inp("reason"), { name: "reason" })}<div class="row"><button class="btn danger" name="do" value="decline">Decline</button><span class="spacer"></span><button class="btn primary" name="do" value="accept">${d.type === "sla" ? "Sign agreement" : "Accept quote"}</button></div></form></div></section>` : ""}`;
};
FORMS["client-decide"] = (v, f) => {
  const d = find("docs", f.dataset.id);
  if (v.do === "decline") { if (!v.reason.trim()) throw new Invalid("Tell us why you're declining.", { reason: "Required to decline." }); d.status = "declined"; d.declineReason = v.reason.trim(); d.decidedAt = Date.now(); notify([d.createdBy], `${d.number} was declined: ${d.declineReason}`, "doc", d.id); return "Declined. Afrilinq has been told."; }
  const e = {}; if (v.name.trim().split(/\s+/).length < 2) e.name = "Type your full name."; if (!v.agree) e.agree = "Confirm you're authorised."; if (Object.keys(e).length) throw new Invalid("Check the highlighted fields.", e);
  Object.assign(d, { status: "accepted", signedBy: v.name.trim(), signedTitle: v.title, method: "online", decidedAt: Date.now(), ip: "102.89.x.x" });
  logActivity({ type: "note", subject: `${DOC_TYPES[d.type].label} ${d.number} ${d.type === "sla" ? "signed" : "accepted"} online by ${d.signedBy}`, companyId: d.companyId, contactId: d.contactId, dealId: d.dealId });
  notify([d.createdBy, ...(d.type === "quote" ? usersWith("billing.manage").filter((u) => U(u).role === "finance") : [])], `${d.number} ${d.type === "sla" ? "signed" : "accepted"} by ${d.signedBy}`, "doc", d.id); audit("document.accepted", d.number, d.signedBy);
  return d.type === "sla" ? "Agreement signed. Thank you." : "Quote accepted. Thank you.";
};

/* ===== Reports ===== */
PAGES.reports = (r) => {
  const tab = r.tab || (can("reports.executive") ? "exec" : can("reports.sales") ? "sales" : can("reports.onboarding") ? "onboarding" : "support");
  const tabs = [["exec", "Executive", "reports.executive"], ["sales", "Sales", "reports.sales"], ["onboarding", "Onboarding", "reports.onboarding"], ["support", "Support", "reports.support"]].filter((x) => can(x[2]));
  const bars = (rows, fmt = (x) => x) => { const max = Math.max(1, ...rows.map((x) => x[1])); return `<div class="bars">${rows.map(([l, v, drill]) => `<button class="bar" data-act="drill" data-d="${esc(JSON.stringify(drill || []))}" data-t="${esc(l)}"><span class="small">${esc(l)}</span><span class="track"><span class="fill" style="display:block;width:${(v / max) * 100}%"></span></span><span class="num small strong">${fmt(v)}</span></button>`).join("")}</div>`; };
  const open = S.deals.filter((d) => !["won", "lost"].includes(d.stage)), won = S.deals.filter((d) => d.stage === "won"), lost = S.deals.filter((d) => d.stage === "lost");
  const tks = S.tickets, met = tks.filter((t) => t.firstResponseAt && sla(t).resp[0] === "Met").length, resp = tks.filter((t) => t.firstResponseAt).length;
  const sections = {
    sales: `<div class="cols-even"><section class="panel"><div class="panel-head"><h2>Pipeline by stage (₦)</h2><span class="small muted">Click a bar for the deals</span></div><div class="panel-body">${bars(STAGES.filter((s) => !["won", "lost"].includes(s.key)).map((s) => { const ds = open.filter((d) => d.stage === s.key); return [s.name, ds.reduce((a, d) => a + d.amount, 0), ds.map((d) => ["deal", d.id, d.name])]; }), nairaM)}</div></section>
      <section class="panel"><div class="panel-head"><h2>Win rate</h2></div><div class="panel-body"><div class="stat" style="cursor:default"><span class="l">Won vs lost (all time)</span><span class="v">${won.length + lost.length ? Math.round((won.length / (won.length + lost.length)) * 100) : 0}%</span><span class="s">${won.length} won · ${lost.length} lost · loss reasons: ${lost.map((d) => d.lossReason).join(", ") || "—"}</span></div>${bars(Object.entries(USERS).filter(([, u]) => u.role === "sales_executive").map(([id, u]) => [u.name, won.filter((d) => d.owner === id).reduce((a, d) => a + d.amount, 0), won.filter((d) => d.owner === id).map((d) => ["deal", d.id, d.name])]), nairaM)}</div></section></div>`,
    onboarding: `<div class="cols-even"><section class="panel"><div class="panel-head"><h2>Projects by risk</h2></div><div class="panel-body">${bars(["high", "medium", "low"].map((l) => { const ps = S.projects.filter((p) => !p.draft && p.stage !== "completed" && risk(p).level === l); return [l === "low" ? "On track" : `${l[0].toUpperCase() + l.slice(1)} risk`, ps.length, ps.map((p) => ["project", p.id, p.name])]; }))}</div></section>
      <section class="panel"><div class="panel-head"><h2>Handovers</h2></div><div class="panel-body">${bars(Object.entries(HO_STATUS).map(([k, [l]]) => { const hs = S.handovers.filter((h) => h.status === k); return [l, hs.length, hs.map((h) => ["handover", h.id, deal(h.dealId).name])]; }))}</div></section></div>`,
    support: `<div class="cols-even"><section class="panel"><div class="panel-head"><h2>Open tickets by priority</h2></div><div class="panel-body">${bars(["P1", "P2", "P3", "P4"].map((p) => { const ts = tks.filter((t) => t.priority === p && OPEN_T.includes(t.status)); return [p, ts.length, ts.map((t) => ["ticket", t.id, `${t.number} ${t.subject}`])]; }))}</div></section>
      <section class="panel"><div class="panel-head"><h2>SLA</h2></div><div class="panel-body"><div class="stat" style="cursor:default"><span class="l">First response met</span><span class="v">${resp ? Math.round((met / resp) * 100) : 0}%</span><span class="s">${met} of ${resp} responded tickets</span></div>${bars([["Escalations open", S.escs.filter((e) => ["pending_approval", "open", "in_progress"].includes(e.status)).length, S.escs.filter((e) => ["pending_approval", "open", "in_progress"].includes(e.status)).map((e) => ["ticket", e.ticketId, `${find("tickets", e.ticketId).number} → ${escT(e.kind).label}`])], ["Escalations overdue", S.escs.filter(escOverdue).length, S.escs.filter(escOverdue).map((e) => ["ticket", e.ticketId, find("tickets", e.ticketId).number])]])}</div></section></div>`,
  };
  sections.exec = `<div class="stats"><div class="stat" style="cursor:default"><span class="l">Open pipeline</span><span class="v">${nairaM(open.reduce((a, d) => a + d.amount, 0))}</span></div><div class="stat" style="cursor:default"><span class="l">Won</span><span class="v">${nairaM(won.reduce((a, d) => a + d.amount, 0))}</span></div><div class="stat" style="cursor:default"><span class="l">Customers at risk</span><span class="v">${S.companies.filter((c) => c.lifecycle === "customer" && health(c.id).status === "At risk").length}</span></div><div class="stat" style="cursor:default"><span class="l">Open P1/P2</span><span class="v">${tks.filter((t) => OPEN_T.includes(t.status) && ["P1", "P2"].includes(t.priority)).length}</span></div></div>${sections.sales}${sections.onboarding}${sections.support}`;
  return `${header("Reports", "Computed from live records. Every bar drills down to the records behind it.")}<section class="panel"><div class="tabs">${tabs.map(([k, l]) => `<button aria-selected="${tab === k}" data-go="reports" data-tab="${k}">${l}</button>`).join("")}</div></section>${tabs.some((x) => x[0] === tab) ? sections[tab] : forbidden()}`;
};
ACT.drill = (b) => { const rows = JSON.parse(b.dataset.d); modal(b.dataset.t, rows.length ? `<ul class="plain">${rows.map(([p, id, l]) => `<li><button class="link" data-go="${p}" data-id="${id}">${esc(l)}</button></li>`).join("")}</ul>` : `<div class="empty">No records.</div>`); };

/* ===== Settings & audit ===== */
PAGES.settings = (r) => {
  const tab = r.tab || "roles", admin = can("admin.settings"), s = S.settings;
  const tabs = [["roles", "Roles & permissions"], ["users", "Users"], ["pipeline", "Pipeline"], ["sla", "SLA policies"], ["billing", "Billing details"], ["health", "Health weights"]];
  let body = "";
  if (tab === "roles") { const cats = {}; Object.entries(PERMS.permissions).forEach(([k, v]) => (cats[v.category] = cats[v.category] || []).push([k, v.description])); body = `<p class="small muted" style="margin:0 0 8px">Default mapping. A Super Admin can change it; changes take effect on the next request.</p><div class="tw"><table><thead><tr><th>Permission</th>${PERMS.roles.map((x) => `<th style="writing-mode:vertical-rl;transform:rotate(180deg);text-transform:none;letter-spacing:0">${esc(x.name)}</th>`).join("")}</tr></thead><tbody>${Object.entries(cats).map(([c, ps]) => `<tr><td colspan="${PERMS.roles.length + 1}" class="small muted strong" style="background:var(--raised)">${esc(c)}</td></tr>${ps.map(([k, dsc]) => `<tr><td title="${esc(dsc)}"><code>${k}</code></td>${PERMS.roles.map((x) => `<td style="text-align:center;color:${x.permissions.includes(k) ? "var(--green)" : "var(--line)"}">${x.permissions.includes(k) ? "✓" : "·"}</td>`).join("")}</tr>`).join("")}`).join("")}</tbody></table></div>`; }
  if (tab === "users") body = `<div class="tw"><table><thead><tr><th>Name</th><th>Role</th><th>Team</th><th></th></tr></thead><tbody>${Object.entries(USERS).map(([id, u]) => `<tr><td class="strong">${esc(u.name)}</td><td>${esc(ROLE[u.role].name)}</td><td>${esc(u.team)}</td><td>${id === me() ? pill("You", "brand") : `<button class="btn sm" data-act="switch-user" data-id="${id}">View as</button>`}</td></tr>`).join("")}</tbody></table></div><p class="small muted">In the CRM, users join by invitation link; there's no public sign-up.</p>`;
  if (tab === "pipeline") body = `<div class="tw"><table><thead><tr><th>#</th><th>Stage</th><th>Probability</th><th>Required fields</th></tr></thead><tbody>${STAGES.map((x, i) => `<tr><td class="num">${i + 1}</td><td class="strong">${esc(x.name)}</td><td class="num">${x.p}%</td><td class="small">${x.key === "won" ? "Value, primary contact, products, agreement reference, billing frequency, start date, approved discount" : x.key === "lost" ? "Loss reason" : x.req.map((q) => REQ_LABEL[q]).join(", ") || "—"}</td></tr>`).join("")}</tbody></table></div><p class="small muted">Discount threshold: ${s.discountThreshold}%.</p>`;
  if (tab === "sla") body = Object.entries(SLA_TARGETS).map(([tier, t]) => `<h3>${tier} tier</h3><div class="tw"><table><thead><tr><th>Priority</th><th>First response</th><th>Resolution</th><th>Coverage</th></tr></thead><tbody>${Object.entries(t).map(([p, [a, b2, c]]) => `<tr><td>${sevPill(p)}</td><td>${a < 1 ? `${a * 60} min` : `${a} h`}</td><td>${b2} h</td><td>${c}</td></tr>`).join("")}</tbody></table></div>`).join("") + `<p class="small muted">Business hours 08:00–17:00 Mon–Fri, Africa/Lagos, public holidays excluded. Waiting on Customer and Waiting on Third Party pause the clock. (The prototype counts calendar hours.)</p>`;
  if (tab === "billing") body = `<form class="f" data-form="settings-billing"><div class="grid2">${[["legalName", "Legal name"], ["address", "Address"], ["email", "Billing email"], ["phone", "Phone"], ["rc", "RC number"], ["tin", "TIN"], ["bank", "Bank"], ["accountName", "Account name"], ["accountNumber", "Account number"], ["vat", "VAT rate (%)"], ["terms", "Payment terms (days)"], ["validity", "Quote validity (days)"]].map(([k, l]) => fld(l, inp(k, s[k], typeof s[k] === "number" ? "number" : "text", admin ? "" : "disabled"))).join("")}</div>${admin ? `<div class="row"><span class="spacer"></span><button class="btn primary">Save billing details</button></div>` : ""}</form><p class="small muted">These print on every quote, invoice and SLA. The sample values are placeholders.</p>`;
  if (tab === "health") body = `<form class="f" data-form="settings-health"><div class="grid2">${Object.entries(s.healthWeights).map(([k, v]) => fld(k[0].toUpperCase() + k.slice(1), inp(k, v, "number", `min="0" max="100" ${admin ? "" : "disabled"}`))).join("")}</div>${admin ? `<div class="row"><span class="spacer"></span><button class="btn primary">Save weights</button></div>` : ""}</form>`;
  return `${header("Settings", admin ? "Configuration for the whole CRM." : "Read-only for your role.")}<section class="panel"><div class="tabs">${tabs.map(([k, l]) => `<button aria-selected="${tab === k}" data-go="settings" data-tab="${k}">${l}</button>`).join("")}</div><div class="panel-body">${body}</div></section>`;
};
ACT["switch-user"] = (b) => { S.me = b.dataset.id; S.hist = []; render(); toast(`Now viewing as ${U(me()).name}, ${roleName(me())}`); };
FORMS["settings-billing"] = (v) => { Object.keys(v).forEach((k) => { S.settings[k] = typeof S.settings[k] === "number" ? Number(v[k]) || 0 : v[k]; }); audit("settings.updated", "Billing details"); return "Billing details saved."; };
FORMS["settings-health"] = (v) => { Object.keys(v).forEach((k) => (S.settings.healthWeights[k] = Number(v[k]) || 0)); audit("settings.updated", "Health weights"); return "Weights saved. Health scores recalculated."; };
PAGES.audit = () => `${header("Audit log", "Sensitive changes: stage and amount, discounts, priority, handover decisions and overrides, completions, documents, payments and settings.")}
  <section class="panel"><div class="tw"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Record</th><th>Detail</th></tr></thead><tbody>${S.audit.map((a) => `<tr><td class="num small">${fmtDT(a.at)}</td><td>${esc(U(a.by).name)}</td><td><code>${esc(a.action)}</code></td><td>${esc(a.entity)}</td><td class="small">${esc(a.detail)}</td></tr>`).join("")}</tbody></table></div></section>`;

/* ===== boot ===== */
S = load();
$("#bell").addEventListener("click", () => { const d = $("#drawer"); d.hidden = !d.hidden; $("#bell").setAttribute("aria-expanded", String(!d.hidden)); if (!d.hidden) drawer(); });
$("#reset").addEventListener("click", () => { S = seed(); closeModal(); $("#drawer").hidden = true; render(); toast("Demo reset to the sample data."); });
$("#search").addEventListener("keydown", (e) => { if (e.key === "Enter") search(e.target.value); });
render();

</script>
